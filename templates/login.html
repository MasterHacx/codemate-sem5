{% extends 'base.html' %}

{% block title %}Login - CODEMATE{% endblock %}

{% block styles %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="card-title text-center mb-4">Welcome Back!</h3>
                        
                        <form id="login-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            
                            <div class="mb-3">
                                <div class="d-flex justify-content-between">
                                    <label for="password" class="form-label">Password</label>
                                    <a href="/forgot-password" class="forgot-password-link">Forgot?</a>
                                </div>
                                <div class="password-wrapper">
                                    <input type="password" class="form-control" id="password" name="password" required>
                                    <i class="fas fa-eye password-toggle-icon"></i>
                                </div>
                            </div>
                            <p id="form-error" class="form-error-message"></p>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-block">Login</button>
                            </div>
                        </form>

                        <div class="divider-or my-4">OR</div>

                        <div class="d-grid gap-2">
                            <button id="google-signin-btn" class="btn btn-google">
                                <i class="fab fa-google me-2"></i> Continue with Google
                            </button>
                        </div>

                        <p class="mt-4 text-center text-secondary">
                            Don't have an account? <a href="/signup">Sign Up</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% endblock %}
