{% extends 'base.html' %}
{% block title %}Forgot Password - CODEMATE{% endblock %}
{% block styles %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
{% endblock %}

{% block content %}
<div class="login-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <h3 class="card-title text-center mb-4">Reset Your Password</h3>
                        <p class="text-center text-secondary mb-4">Enter your email and we'll send you a link to get back into your account.</p>
                        
                        <form id="forgot-password-form">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email address</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-block">Send Reset Link</button>
                            </div>
                        </form>
                        <p class="mt-4 text-center">
                            <a href="/login">Back to Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
