<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}Admin Panel{% endblock %} - CODEMATE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
body { display: flex; min-height: 100vh; }
.sidebar { width: 250px; background-color: #343a40; color: #fff; flex-shrink: 0; }
.sidebar .nav-link { color: #adb5bd; }
.sidebar .nav-link.active, .sidebar .nav-link:hover { color: #fff; }
.content { flex-grow: 1; padding: 30px; }
</style>
</head>
<body>
<!-- Sidebar Navigation -->
<div class="d-flex flex-column flex-shrink-0 p-3 sidebar">
<a href="{{ url_for('admin.dashboard') }}" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
<span class="fs-4">CODEMATE Admin</span>
</a>
<hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <!-- Link for Quizzes Dashboard -->
                <a href="{{ url_for('admin.dashboard') }}" class="nav-link {% if 'quiz' in request.endpoint %}active{% endif %}">
                    <i class="fas fa-question-circle me-2"></i> Manage Quizzes
                </a>
            </li>
            <li>
                <!-- Link for Tutorials Dashboard-->
                <a href="{{ url_for('admin.manage_tutorials') }}" class="nav-link {% if 'tutorial' in request.endpoint %}active{% endif %}">
                    <i class="fas fa-book-open me-2"></i> Manage Tutorials
                </a>
            </li>
        </ul>
<hr>
<a href="{{ url_for('admin.admin_logout') }}" class="nav-link text-white"><i class="fas fa-sign-out-alt me-2"></i> Logout</a>
</div>
<!-- Main Content Area -->
<div class="content">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'success' if category == 'success' else 'warning' }}" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
